<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Foliux PDF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fondo: cuadrado redondeado -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <!-- Hoja con esquina doblada -->
  <g filter="url(#shadow)">
    <path d="M286 172 H600 L752 324 V820 a44 44 0 0 1 -44 44 H286 a44 44 0 0 1 -44 -44 V216 a44 44 0 0 1 44 -44 Z" fill="#ffffff"/>
  </g>
  <path d="M600 172 L752 324 H644 a44 44 0 0 1 -44 -44 Z" fill="url(#fold)"/>
  <!-- Letra F: el trazo de un folio -->
  <path d="M372 400 H620 a38 38 0 0 1 0 76 H452 V548 H588 a38 38 0 0 1 0 76 H452 V752 a40 40 0 0 1 -80 0 Z" fill="#4f46e5"/>
  <!-- Línea de texto inferior -->
  <rect x="372" y="812" width="190" height="22" rx="11" fill="#a5b4fc"/>
</svg>
