# Configuración del instalador (electron-builder)
appId: com.foliux.pdf
productName: Foliux PDF
copyright: Copyright © Foliux
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true

# qpdf (Apache 2.0) viaja junto a la aplicación, fuera del asar: es un ejecutable externo
extraResources:
  - from: resources/qpdf
    to: qpdf
    filter: ['**/*']

# Asociación de archivos .pdf: "Abrir con Foliux PDF" y, si el usuario quiere, aplicación predeterminada
fileAssociations:
  - ext: pdf
    name: Documento PDF
    description: Documento PDF
    mimeType: application/pdf
    role: Viewer

# Las actualizaciones se publican como Releases de GitHub (el instalador, su .blockmap y latest.yml)
publish:
  provider: github
  owner: WilliamsAlexis
  repo: Foliux-PDF

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Foliux PDF
  installerLanguages: [es_ES]
  language: '3082' # español (España)
  artifactName: Foliux-PDF-Setup-${version}.${ext}

# Preparado para macOS y Linux (se compilan desde su propio sistema operativo)
mac:
  category: public.app-category.productivity
  target: [dmg]
linux:
  category: Office
  target: [AppImage, deb]
  mimeTypes: [application/pdf]
